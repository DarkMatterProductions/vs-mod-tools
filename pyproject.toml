[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ── Project metadata ──────────────────────────────────────────────────────────

[project]
name = "vs-mod-tools"
version = "0.1.0"
description = "Vintage Story mod tooling utilities"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "James Boylan", email = "drahkar@darkmatter-productions.com" },
]
maintainers = [
    { name = "Darkmatter Productions", email = "pypi@darkmatter-productions.com" },
]
keywords = ["vintage-story", "modding", "game-tools"]
dependencies = [
    "json5>=0.9",
]

[project.scripts]
vs-show-variants = "vs_mod_tools.cli.show_variants:main"

# ── Dev dependency group (PEP 735) ────────────────────────────────────────────

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.9",
    "flake8>=7.0",
    "flake8-pyproject>=1.2",
]

# ── Hatch build config ────────────────────────────────────────────────────────

[tool.hatch.build.targets.wheel]
packages = ["src/vs_mod_tools"]

# ── black ─────────────────────────────────────────────────────────────────────

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

# ── isort ─────────────────────────────────────────────────────────────────────

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]
line_length = 88
known_first_party = ["vs_mod_tools"]

# ── mypy ──────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true      # json5 ships no stubs
mypy_path = "src"

# ── flake8 (via flake8-pyproject) ─────────────────────────────────────────────

[tool.flake8]
max-line-length = 88
extend-ignore = [
    "E203",   # whitespace before ':' — conflicts with black
    "W503",   # line break before binary operator — conflicts with black
]
exclude = [".git", "__pycache__", ".venv", "build", "dist"]
per-file-ignores = [
    "tests/*:S101",   # allow assert statements in tests
]

# ── pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=vs_mod_tools",
    "--cov-report=term-missing",
    "--cov-branch",
    "--import-mode=importlib",
]

# ── coverage ──────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["vs_mod_tools"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
